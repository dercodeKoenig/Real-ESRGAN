# general settings
name: train_diffusion_v1
model_type: DiffusionSRModel
num_gpu: auto
manual_seed: 0

# ----------------- options for synthesizing training data  ----------------- #

# the first degradation process
resize_prob: [0.2, 0.7, 0.1]  # up, down, keep
resize_range: [0.15, 1.5]
gaussian_noise_prob: 0.5
noise_range: [1, 30]
poisson_scale_range: [0.05, 3]
gray_noise_prob: 0.4
jpeg_range: [30, 95]

# the second degradation process
second_blur_prob: 0.8
resize_prob2: [0.3, 0.4, 0.3]  # up, down, keep
resize_range2: [0.3, 1.2]
gaussian_noise_prob2: 0.5
noise_range2: [1, 25]
poisson_scale_range2: [0.05, 2.5]
gray_noise_prob2: 0.4
jpeg_range2: [30, 95]

gt_size: 512
queue_size: 64

# dataset and data loader settings
datasets:
  train:
    name: dataset
    type: RealESRGANDataset
    dataroot_gt: /
    meta_info: meta_info.txt
    io_backend:
      type: disk

    blur_kernel_size: 21
    kernel_list: ['iso', 'aniso', 'generalized_iso', 'generalized_aniso', 'plateau_iso', 'plateau_aniso']
    kernel_prob: [0.45, 0.25, 0.12, 0.03, 0.12, 0.03]
    sinc_prob: 0.1
    blur_sigma: [0.2, 3]
    betag_range: [0.5, 4]
    betap_range: [1, 2]

    blur_kernel_size2: 21
    kernel_list2: ['iso', 'aniso', 'generalized_iso', 'generalized_aniso', 'plateau_iso', 'plateau_aniso']
    kernel_prob2: [0.45, 0.25, 0.12, 0.03, 0.12, 0.03]
    sinc_prob2: 0.1
    blur_sigma2: [0.2, 1.5]
    betag_range2: [0.5, 4]
    betap_range2: [1, 2]

    final_sinc_prob: 0.8

    use_hflip: True
    use_rot: False

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 8
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  # Uncomment these for validation
  val:
     name: validation
     type: PairedImageDataset
     dataroot_gt: tests/data/gt
     dataroot_lq: tests/data/lq_4
     scale: 4
     io_backend:
       type: disk

# network structures
network_g:
  type: RRDBNet_v3
  num_in_ch: 6
  num_out_ch: 3
  highway_channels: 64
  processing_channels: 32
  num_block: 8
  num_grow_ch: 32
  num_pre_upscale_ch: 64
  scale: 1 # scale will be dynamic, input should have same resolution as output
  use_attention: true

# path
path:
  # use the pre-trained Real-ESRNet model
  pretrain_network_g: 
  param_key_g: params_ema
  strict_load_g: true
  resume_state: 

# training settings
train:
  min_scale: 1.0
  max_scale: 4.0
  warmup_iter: 2000
  total_iter: 50000

  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: 0.0001
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
      type: MultiStepLR
      milestones: [500000]
      gamma: 0.5

val:
   val_freq: 500
   save_img: True

   metrics:
     psnr: # metric name
       type: calculate_psnr
       crop_border: 4
       test_y_channel: false
     ssim: 
       type: calculate_ssim
       crop_border: 4
       test_y_channel: false
     niqe:
         type: calculate_niqe
         crop_border: 4
         better: lower 


# logging settings
logger:
  print_freq: 50
  save_checkpoint_freq: 5000
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500